# What the static analysis is told about this project. It describes the shape of
# the repository and nothing else: the coverage reports named at the end are
# produced by the test runs, not by the scanner.

sonar.projectKey=MathTrail_canvas-api
sonar.organization=mathtrail

sonar.sources=.
sonar.tests=.
# Tests are the files Go and Vitest run as tests, and the program a test builds
# to read back what the linker set. Like any test they measure and are not
# measured.
sonar.test.inclusions=**/*_test.go,internal/version/testdata/**,web/**/*.test.ts,web/**/*.test.tsx

# The mockup a design tool exported, with its own copy of React; the summary of
# the stack, a document whose script only draws its tables; the mocks mockery
# generates, and the code buf generates from proto/; and the tools that have
# checks of their own. None of it is code of the product that anybody here
# writes, and all of it would be measured as if it were.
sonar.exclusions=draft/**,docs/stack.html,**/mocks/**,gen/**,web/src/gen/**,tools/**
sonar.test.exclusions=tools/**
# The SPA's entry point only finds the page's root and starts what the tests
# cover, as the tests' own configuration says. The build's configurations are
# declarations: every build and every run of the tests is what loads them.
sonar.coverage.exclusions=web/src/main.tsx,web/*.config.ts

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
