# What a green main produces: the server built for the architectures it runs on,
# the SPA as Firebase Hosting serves it, the sums of what was built, and a
# signature for each of them. What matters is that anybody can check that a
# file came from this repository, from this workflow run on main, at the commit
# the release's tag points at (R52).
#
# Nobody tags anything by hand: the version is the next patch of the line the
# releases are numbered in, and the tag is created with the release. A number
# of its own comes from raising RELEASE_LINE in the change that deserves it. The
# button releases the tip of main when no release has yet — after a release run
# that failed, say — and only then is a version asked for on it used; it works
# on main alone, and only once the checks have passed on that commit (R33, R45,
# R52).
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as v1.0.0. Left empty, the patch number goes up by one."
        required: false

permissions:
  contents: read

# The line the releases are numbered in: the major and minor version every
# release carries, the patch counting up within it. A change that deserves a
# new number raises it here, and the release after it is the line's first.
# just release-version reads it from here when it is given no line.
env:
  RELEASE_LINE: "0.1"

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, sign and publish
    # Releases queue rather than overlap: each has to see the version the one
    # before it published before it can work out the next. Every one waits its
    # turn, up to a hundred, rather than the newest pushing out the one that
    # waited before it, so each commit of main gets its release however fast
    # the merges come (R52).
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have already passed on, and only when that
    # commit is this repository's own. A pull request from a fork runs the
    # checks here as well, and the branch filter above matches on the name of
    # the branch it came from — so a fork whose branch is called main would
    # otherwise have its code built, signed and published under this
    # repository's identity.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.newest.outputs.newest }}
    permissions:
      # Creating the release and uploading what it holds.
      contents: write
      # The short-lived identity the signature is made with: no key is stored
      # anywhere, and the certificate records which workflow signed what.
      id-token: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
    steps:
      # Asked before anything of the repository is fetched. A run on another
      # branch publishes nothing, and neither does a commit whose checks have
      # not passed: main's run of CI for this very commit has to have finished
      # green.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the checks ran on, and the whole history with it: the
          # next version is read from the tags, which a shallow clone lacks.
          # No token is left in the clone for the build that runs in it.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$(just release-version "$RELEASE_LINE" "$REQUESTED")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
              echo "releasing $version"
          else
              echo "::notice::Nothing to publish: this commit is released already."
          fi

      # Built on the runner rather than in the toolchain image, and from nothing
      # a cache kept: what is signed is made of what this run fetched.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/node
        if: steps.version.outputs.version != ''

      - name: Build the artifacts
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: just release-artifacts "$VERSION"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.version.outputs.version != ''
        with:
          cosign-release: v3.1.3

      # Signed before anything is published: a release that appears without
      # its signatures is worse than no release at all. One bundle per file,
      # carrying the signature and the certificate that says which workflow
      # made it; SECURITY.md says how to check it.
      - name: Sign every artifact
        if: steps.version.outputs.version != ''
        working-directory: dist
        run: |
          for file in *; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          ls -1

      # main is read once, and the answer serves twice. Latest is the release
      # of the newest of main: an older commit whose checks finished late comes
      # out under a higher number, and GitHub would otherwise call it Latest by
      # that number. And only the newest of main is delivered (R45), so the
      # output newest says the same thing the release page does.
      - name: Publish the release
        id: newest
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The notes run from the release before this one; the first release
          # has none before it.
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)
          start=()
          if [ -n "$previous" ]; then start=(--notes-start-tag "$previous"); fi
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          newest=false
          if [ "$tip" = "$TARGET" ]; then newest=true; fi
          gh release create "$VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest="$newest" \
              --generate-notes "${start[@]}"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          if [ "$newest" != true ]; then
              echo "main ends at $tip now: $TARGET is released, and is not the newest of main"
          fi
