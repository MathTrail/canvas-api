# Every check that decides whether a change may be merged, on every pull
# request and every commit of main. The checks run inside the toolchain stage
# of the development image, so a verdict here and a verdict in the container
# come from the same tools at the same versions; the work itself lives in the
# justfile.
#
# A check a merge waits for comes from a workflow that always starts: one held
# back by a filter on paths leaves its checks waiting for good, and the pull
# request with them (R231 standalone). So nothing here filters on paths, and
# work that only some changes need is skipped by a step inside its job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# A new push to a pull request replaces the run still going for the one before:
# only its newest commit can be merged. On main every commit gets a run of its
# own: a group holds at most one waiting run and drops the one that waited
# before it, which would leave a commit of main unchecked, and every commit of
# main is one a release is cut from (R45).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Settings every job needs, passed through the environment rather than written
# into a home directory, so that they hold for every step whatever user it runs
# as.
env:
  # Git refuses a repository whose files belong to somebody else, which is what
  # a checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  # Fixed places for what Go downloads and builds, so that the paths a job
  # caches and the paths Go reads are the same ones.
  GOMODCACHE: /tmp/go/mod
  GOCACHE: /tmp/go/build

# bash, which GitHub runs with pipefail: a step that pipes one command into
# another fails when the first one does.
defaults:
  run:
    shell: bash

# No job pushes to the repository, so no checkout leaves its token behind in
# the clone for the steps after it.
jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The one job that publishes the image: it is built and published here when
    # nothing is published yet for its definition, or, on main, when main did
    # not sign what is (R53); the job after it only adds the signature. A pull request from a fork
    # gets a token that cannot publish, and runs on what is published already
    # (R20 standalone).
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/just
      # A push is main's, and main runs its checks only in an image it signed
      # itself; cosign is what reads the signature (R53).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        # Read into a variable first: inside the echo, a recipe that failed
        # would leave the step green and the reference empty.
        env:
          ACCEPT: ${{ github.event_name == 'push' && 'signed' || 'published' }}
        run: |
          reference="$(just ci-toolchain-image "$ACCEPT")"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  # The signature main's next run checks the image by. Only this job holds
  # the identity it is made with, and it runs nothing but cosign. A signature
  # that failed — an outage of Sigstore — fails no check: the image was built
  # by this very run, and the next run of main builds it again and signs it
  # then (R53).
  toolchain-signature:
    name: Toolchain image signature
    needs: toolchain
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/just
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
        run: just ci-toolchain-sign "$IMAGE"

  lint:
    name: Formatting and lint
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The container every check runs in, written once here and named by its
    # anchor in the jobs below.
    container: &toolchain-container
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each job that runs Go keeps a cache of its own: what one job downloads
      # and builds, another does not, and a shared one would be saved by
      # whichever job finished first. The key names what decides the contents —
      # the module's requirements, the versions of the tools the justfile runs,
      # and the toolchain image, whose Go builds them — and when it is new, the
      # job starts from its own last cache. Written once here, and named by its
      # anchor below.
      - &go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'justfile') }}-${{ needs.toolchain.outputs.image }}
          restore-keys: go-${{ github.job }}-
      - run: just ci-lint

  test:
    name: Tests
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: *toolchain-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *go-cache
      - run: just ci-test
      # Codecov holds the changed lines to 90% through its patch status, which
      # the ruleset of main requires; the upload itself fails nothing, so that
      # a run with no token to upload with, or an outage, is no red test (R50).
      - name: Send the coverage profile to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          slug: MathTrail/canvas-api
          fail_ci_if_error: false
          # The uploader the action downloads, at an exact version rather than
          # whatever is newest on the day; the action checks its signature.
          version: v11.3.1
      # The coverage the tests measured is kept with the run, for what reads it
      # afterwards, so that nothing runs the tests a second time to measure it.
      - name: Keep the coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  web:
    name: SPA
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: *toolchain-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: just ci-web
      # The report names its files from the repository's root, where the tools
      # that read coverage look for them. Sent as the Go profile is, beside it.
      - name: Send the SPA's coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          disable_search: true
          slug: MathTrail/canvas-api
          fail_ci_if_error: false
          version: v11.3.1
      - name: Keep the SPA's coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  # No cache: while .mockery.yaml names no interface, the check builds nothing,
  # and a cache with nothing in it only warns on every run that there was
  # nothing to save. The first interface brings *go-cache back (R49).
  mocks:
    name: Generated mocks
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: *toolchain-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: just ci-mocks-check

  dependencies:
    name: Vulnerabilities and licenses
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: *toolchain-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *go-cache
      - run: just ci-vuln
      - run: just ci-licenses

  secrets:
    name: Secrets
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: *toolchain-container
    steps:
      # The whole history: a key that was committed and then removed is still
      # published, and a shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *go-cache
      - run: just ci-secrets

  # The recipes a release is cut with, run here with the version release.yml
  # would publish, so that a change that breaks them cannot merge and leave
  # main without its release. The release itself builds on the runner (R52).
  # Nothing built here leaves the job. The whole history: the version is read
  # from the tags.
  release:
    name: Release build
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: *toolchain-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *go-cache
      # A commit released already gets no version, and is built as the rest
      # of the build names it.
      - run: |
          version="$(just release-version)"
          if [ -n "$version" ]; then
              just release-artifacts "$version"
          else
              just release-artifacts
          fi

  sonar:
    name: Static analysis
    needs: [test, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # SonarCloud reports and gates nothing (R31 standalone), and so may not stop
    # a release either, which waits for this whole run to be green (R45). A
    # failed analysis — no token on main, an outage — turns this job red for
    # anyone to see, and leaves the run green (R50).
    continue-on-error: true
    # A third party's scanner runs here with a token of ours, so the job's own
    # token reads the code and nothing else: no package of this repository.
    permissions:
      contents: read
    # On the runner: the scanner installs itself, and has no business in the
    # environment the code is built in.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: what makes a line "new" is which commit added it.
          fetch-depth: 0
          persist-credentials: false
      # The coverage the tests already measured, rather than a second run of them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-web
          path: web/coverage
      # A pull request's run has the token only when it was given the secret:
      # not one from a fork, nor one Dependabot starts while the token is not
      # among the secrets kept for Dependabot. Such a run is not analysed, since
      # a check nobody can pass has no business being red, and what it changes
      # is analysed once it reaches main — where a missing token is a failure.
      - id: token
        run: echo "present=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.token.outputs.present == 'true' || github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # On the runner: building and running an image takes a Docker daemon, and
    # the toolchain image has no Docker client, since the development container
    # gets Docker from a feature that a build of the Dockerfile alone does not
    # apply. The image is built, started, scanned and thrown away — nothing
    # leaves the runner. One run of just builds it once for both checks, with
    # one build date; each recipe is given its tag, since a recipe that takes
    # one would read the next recipe's name as its tag. It pulls no package of
    # this repository, so its token reads the code alone.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/just
      - uses: ./.github/actions/docker-mirror
      - run: just ci-image-smoke canvas-api:dev ci-image-scan canvas-api:dev
