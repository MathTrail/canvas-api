name: just
description: Installs just at the version this repository pins for it.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # The version lives where the tool is installed, as the default of an ARG,
        # so it is written down once and read from there.
        dockerfile="$GITHUB_WORKSPACE/.devcontainer/Dockerfile"
        version="$(sed -n 's/^ARG JUST_VERSION=//p' "$dockerfile")"
        if [ -z "$version" ]; then
            echo "just: $dockerfile pins no JUST_VERSION" >&2
            exit 1
        fi

        case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64 | arm64) arch=aarch64 ;;
            *) echo "just: unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        echo "just $version"
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL --retry 3 --proto "=https" --proto-redir "=https" \
            "https://github.com/casey/just/releases/download/${version}/just-${version}-${arch}-unknown-linux-musl.tar.gz" \
            | tar -C "$RUNNER_TEMP/bin" -xz just
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
